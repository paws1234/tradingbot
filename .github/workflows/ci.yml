# CI/CD pipeline for the TradingBot project (this repo's remote is GitHub).
#
# Runs twice around a merge:
#   - on `pull_request`               → the PRE-MERGE gate that auto-merge waits for
#   - on `push` (default branch)      → the POST-MERGE verification re-run
# It installs the pinned dependencies, runs the pytest suite, and builds the
# Docker image. No linter is configured for this stack, so the lint stage is
# intentionally skipped.
#
# To gate auto-merge: /create-pr runs `git_host.sh require-check <default> Tests
# copilot-pull-request-reviewer` (branch protection: required `Tests` + Copilot
# review checks + 1 approving review) and only then arms auto-merge. Branch
# protection requires a public repo or a paid plan.
#
# The pipeline is standard for the Python/FastAPI stack and needs no
# per-project modification — the app and its requirements live in TradingBot/.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TradingBot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: TradingBot/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suite
        run: pytest

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        # The Dockerfile ships in Phase 5 (task 17); until it exists this step
        # is a no-op so early PRs stay green. hashFiles is only available in
        # step-level `if` conditions, not job-level ones.
        if: ${{ hashFiles('TradingBot/Dockerfile') != '' }}
        run: docker build -t tradingbot TradingBot/
