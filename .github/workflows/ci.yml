# CI/CD pipeline for the TradingBot project (this repo's remote is GitHub).
#
# Runs on every push and pull request: install the pinned dependencies, run
# the pytest suite, and build the Docker image. No linter is configured for
# this stack, so the lint stage is intentionally skipped.
#
# The pipeline is standard for the Python/FastAPI stack and needs no
# per-project modification — the app and its requirements live in TradingBot/.

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TradingBot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: TradingBot/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suite
        run: pytest

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        # The Dockerfile ships in Phase 5 (task 17); until it exists this step
        # is a no-op so early PRs stay green. hashFiles is only available in
        # step-level `if` conditions, not job-level ones.
        if: ${{ hashFiles('TradingBot/Dockerfile') != '' }}
        run: docker build -t tradingbot TradingBot/
